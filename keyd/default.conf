# keyd — system-level key remapper (https://github.com/rvaiya/keyd). Runs as root at
# the evdev layer, so remaps apply under any compositor, under X11, and at the TTY.
# install.sh copies this file to /etc/keyd/default.conf. Apply changes after editing:
#   sudo install -Dm644 keyd/default.conf /etc/keyd/default.conf && sudo keyd reload
#
# overload(layer, key): hold the key = activate `layer`; tap and release = emit `key`.

[ids]

*

[main]

# CapsLock is Esc when tapped, Ctrl when held; Esc becomes CapsLock.
capslock = overload(control, esc)
esc = capslock

# Right Alt acts as Super (niri's "Mod"): this laptop's physical Super key is dead.
# Left Alt is untouched, so every Alt chord still works; the cost is AltGr.
rightalt = layer(meta)
